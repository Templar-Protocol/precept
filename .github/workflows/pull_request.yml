name: pull_request

# Documentation-only changes skip this workflow (build, tests, Kani, Verus,
# fuzz). A change runs it unless every touched file matches paths-ignore;
# no build or test reads these paths. docs/ has its own gate in docs.yml.
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - docs/**
      - docs-library
      - audits/**
      - .gitbook.yaml
      - LICENSE
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - docs/**
      - docs-library
      - audits/**
      - .gitbook.yaml
      - LICENSE

# No job here writes to the repository: they check formatting, build, test, run
# provers and replay/build the fuzz target. Without this, GITHUB_TOKEN takes the
# repository default, which can be write.
permissions:
  contents: read

jobs:

  complete:
    if: always()
    needs: [fmt, build-and-test, kani-codegen, kani-proofs, local-verification]
    runs-on: ubuntu-latest
    steps:
    - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
      run: exit 1

  fmt:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
    - run: rustup toolchain install
    - run: cargo fmt --all --check
    - run: cargo fmt --manifest-path test-suites/fuzz/Cargo.toml --all -- --check

  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
    - uses: stellar/actions/rust-cache@97ffa3486f8d355535d989edfe78795f05ec11b6 # main as of 2026-10-23
    - run: rustup toolchain install
    - uses: stellar/stellar-cli@c0f4d0da891bbf214c08b8c5035ae6db80e9a3bd # v28.1.0
      with:
        version: 28.1.0
    - uses: taiki-e/install-action@cde8c9e634f4a17bc06b61413ac0ef75450eac46
      with:
        tool: just
    - run: just test

  kani-codegen:
    runs-on: ubuntu-latest
    env:
      KANI_VERSION: 0.68.0
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        persist-credentials: false
    - uses: stellar/actions/rust-cache@97ffa3486f8d355535d989edfe78795f05ec11b6 # main as of 2026-10-23
    - run: rustup toolchain install
    - uses: stellar/stellar-cli@c0f4d0da891bbf214c08b8c5035ae6db80e9a3bd # v28.1.0
      with:
        version: 28.1.0
    - uses: taiki-e/install-action@cde8c9e634f4a17bc06b61413ac0ef75450eac46
      with:
        tool: just
    # contractimport! reads target/wasm32v1-none/release/backstop.wasm at compile
    # time, so the proof surface does not compile without the wasm on disk.
    - run: just build
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: |
          ~/.cargo/bin/cargo-kani
          ~/.cargo/bin/kani-driver
          ~/.kani
        key: kani-${{ env.KANI_VERSION }}-${{ runner.os }}
    # The cache restores cargo-kani without cargo's install record, so a plain
    # cargo install refuses to overwrite it ("binary already exists"). Skip when
    # the cached binary is already the right version; force it when it is not.
    - run: |
        if ! cargo-kani --version 2>/dev/null | grep -qF "$KANI_VERSION"; then
          cargo install --locked kani-verifier --version "$KANI_VERSION" --force
        fi
    - run: test -d "$HOME/.kani/kani-$KANI_VERSION" || cargo-kani setup
    # sccache, which stellar/actions/rust-cache installs as RUSTC_WRAPPER, probes
    # the compiler with -E and kani-compiler rejects it, so it cannot wrap Kani.
    # Cleared here rather than job-wide so just build and the install keep it.
    - run: echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
    - run: cargo kani --version
    - run: cargo kani -p pool --lib --only-codegen

  kani-proofs:
    runs-on: ubuntu-latest
    env:
      KANI_VERSION: 0.68.0
      HARNESS_TIMEOUT: 600s
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        persist-credentials: false
    - uses: stellar/actions/rust-cache@97ffa3486f8d355535d989edfe78795f05ec11b6 # main as of 2026-10-23
    - run: rustup toolchain install
    - uses: stellar/stellar-cli@c0f4d0da891bbf214c08b8c5035ae6db80e9a3bd # v28.1.0
      with:
        version: 28.1.0
    - uses: taiki-e/install-action@cde8c9e634f4a17bc06b61413ac0ef75450eac46
      with:
        tool: just
    - run: just build
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: |
          ~/.cargo/bin/cargo-kani
          ~/.cargo/bin/kani-driver
          ~/.kani
        key: kani-${{ env.KANI_VERSION }}-${{ runner.os }}
    # The cache restores cargo-kani without cargo's install record, so a plain
    # cargo install refuses to overwrite it ("binary already exists"). Skip when
    # the cached binary is already the right version; force it when it is not.
    - run: |
        if ! cargo-kani --version 2>/dev/null | grep -qF "$KANI_VERSION"; then
          cargo install --locked kani-verifier --version "$KANI_VERSION" --force
        fi
    - run: test -d "$HOME/.kani/kani-$KANI_VERSION" || cargo-kani setup
    # sccache, which stellar/actions/rust-cache installs as RUSTC_WRAPPER, probes
    # the compiler with -E and kani-compiler rejects it, so it cannot wrap Kani.
    # Cleared here rather than job-wide so just build and the install keep it.
    - run: echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
    - name: Verify the per-PR harness set
      run: |
        set -uo pipefail
        mapfile -t harnesses < <(grep -v '^#' verification/kani-ci-harnesses.txt | grep -v '^[[:space:]]*$')
        if [ "${#harnesses[@]}" -eq 0 ]; then
          echo "::error::empty PR harness selection"
          exit 1
        fi
        mkdir -p "$RUNNER_TEMP/kani-ci"
        for h in "${harnesses[@]}"; do
          log="$RUNNER_TEMP/kani-ci/${h//::/_}.log"
          cargo kani -p pool --lib --exact --harness "$h" \
            --solver kissat -Z unstable-options --harness-timeout "$HARNESS_TIMEOUT" \
            2>&1 | tee "$log"
          result=("${PIPESTATUS[@]}")
          if [ "${result[1]}" -ne 0 ]; then exit 1; fi
          python3 scripts/check_kani_ci.py \
            --selection verification/kani-ci-harnesses.txt --harness "$h" \
            --log "$log" --exit-code "${result[0]}" || exit 1
        done
    - name: Retain per-harness proof logs
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: kani-pr-logs-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/kani-ci/
        if-no-files-found: warn
        retention-days: 14

  local-verification:
    uses: ./.github/workflows/verification-local.yml

name: release

# Builds every release WASM with the toolchains the audit evidence pins and
# publishes them as ONE GitHub release for the tag. It never overwrites: if the
# tag already has a release, the job only checks that the rebuilt bytes match
# that release's SHA256SUMS. A new release is created as a draft for a human to
# review and publish. Nothing is sent to any explorer or network.
#
# Re-check an existing release: Actions -> release -> Run workflow, tag=v0.1.0.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  blend:
    name: pool, backstop, pool_factory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      # The tag picks its own recipe. A standalone pool-oracle-adapter/rust-toolchain.toml
      # marks the audited v0.1.0 layout (Stellar CLI 22.6.0); later tags use 28.1.0.
      # The WASM directory is the target named by the root rust-toolchain.toml.
      - name: Detect layout
        run: |
          if [[ -f pool-oracle-adapter/rust-toolchain.toml ]]; then cli=22.6.0; else cli=28.1.0; fi
          target=$(sed -n 's/^targets = \["\([^"]*\)"\].*/\1/p' rust-toolchain.toml)
          [[ -n "$target" ]] || { echo "no target in rust-toolchain.toml" >&2; exit 1; }
          echo "STELLAR_CLI=$cli" >> "$GITHUB_ENV"
          echo "WASM_DIR=target/$target/optimized" >> "$GITHUB_ENV"
      # Installs the tag's pinned Rust + target from rust-toolchain.toml.
      - run: rustup toolchain install && rustc --version
      - uses: stellar/stellar-cli@c0f4d0da891bbf214c08b8c5035ae6db80e9a3bd # v28.1.0
        with:
          version: ${{ env.STELLAR_CLI }}
      - uses: taiki-e/install-action@cde8c9e634f4a17bc06b61413ac0ef75450eac46
        with:
          tool: just
      # Tags cut before the justfile migration (v0.1.0, v0.1.1) still build with their Makefile.
      - run: if [[ -f justfile ]]; then just build; else make build; fi
      - run: |
          mkdir out
          cp "$WASM_DIR"/{pool,backstop,pool_factory}.wasm out/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: blend
          path: out/*.wasm
          if-no-files-found: error

  adapter:
    name: pool_oracle_adapter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pool-oracle-adapter
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      # Same layout signal as the blend job. The adapter's own preflight (justfile)
      # enforces the exact CLI/Rust each layout needs, so no assertion here.
      - name: Detect layout
        working-directory: .
        run: |
          if [[ -f pool-oracle-adapter/rust-toolchain.toml ]]; then cli=26.0.0; else cli=28.1.0; fi
          echo "STELLAR_CLI=$cli" >> "$GITHUB_ENV"
      # Installs the tag's pinned toolchain: the adapter's own rust-toolchain.toml
      # when standalone (v0.1.0), else the root one (rustup walks up).
      - run: rustup toolchain install && rustc --version
      - uses: taiki-e/install-action@cde8c9e634f4a17bc06b61413ac0ef75450eac46
        with:
          tool: just
      - uses: stellar/stellar-cli@c0f4d0da891bbf214c08b8c5035ae6db80e9a3bd # v28.1.0
        with:
          version: ${{ env.STELLAR_CLI }}
      # Same CI shim as pool-oracle-adapter.yml: rustup selects the toolchain per directory.
      - run: |
          mkdir -p "$RUNNER_TEMP/bin"
          printf '#!/usr/bin/env bash\nexec "$@"\n' > "$RUNNER_TEMP/bin/pool-adapter-env"
          chmod +x "$RUNNER_TEMP/bin/pool-adapter-env"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # `optimize` does not depend on `preflight`; run it so the tag's exact CLI/Rust gate applies.
      - run: just preflight
      - run: just optimize
      - run: |
          mkdir ../out
          cp target/wasm32v1-none/release-soroban-checked/pool_oracle_adapter.optimized.wasm ../out/pool_oracle_adapter.wasm
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: adapter
          path: out/*.wasm
          if-no-files-found: error

  release:
    needs: [blend, adapter]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: out
          merge-multiple: true
      - working-directory: out
        run: sha256sum *.wasm | tee SHA256SUMS
      - name: Verify against the existing release, or create a draft
        working-directory: out
        run: |
          if lookup=$(gh release view "$TAG" 2>&1); then
            gh release download "$TAG" -p SHA256SUMS -O published.SHA256SUMS
            diff -u published.SHA256SUMS SHA256SUMS
            echo "Rebuilt WASMs match the published $TAG release."
          elif [[ "$lookup" == *"release not found"* ]]; then
            commit=$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)
            gh release create "$TAG" --verify-tag --draft --title "$TAG" \
              --notes "Built by the release workflow from $TAG ($commit). Edit these notes before publishing." \
              *.wasm SHA256SUMS
          else
            echo "$lookup" >&2
            exit 1
          fi
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: out/*.wasm

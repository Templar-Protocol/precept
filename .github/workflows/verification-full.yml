name: verification-full

# Expensive harnesses from verification/kani-full-harnesses.txt run weekly.
# The per-PR selection is maintained in verification/kani-ci-harnesses.txt.
permissions:
  contents: read

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      scope:
        description: Full scheduled campaign or bounded local acceptance/replay
        type: choice
        options: [full, local]
        default: full
      harness_timeout:
        description: Per-harness budget, e.g. 10800s
        required: false
        default: 10800s

jobs:
  local-verification:
    if: github.event_name == 'workflow_dispatch' && inputs.scope == 'local'
    uses: ./.github/workflows/verification-local.yml


  harnesses:
    if: github.event_name != 'workflow_dispatch' || inputs.scope != 'local'
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.read.outputs.list }}
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        persist-credentials: false
    - id: read
      run: |
        set -uo pipefail
        list=$(grep -v '^#' verification/kani-full-harnesses.txt \
          | grep -v '^[[:space:]]*$' \
          | jq -R -s -c 'split("\n") | map(select(length > 0))')
        echo "list=$list" >> "$GITHUB_OUTPUT"
        echo "::notice::$(jq -r 'length' <<<"$list") harnesses scheduled"

  kani:
    needs: harnesses
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        harness: ${{ fromJSON(needs.harnesses.outputs.list) }}
    env:
      KANI_VERSION: 0.68.0
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        persist-credentials: false
    - uses: stellar/actions/rust-cache@97ffa3486f8d355535d989edfe78795f05ec11b6 # main as of 2026-10-23
    - run: rustup toolchain install
    - uses: stellar/stellar-cli@c0f4d0da891bbf214c08b8c5035ae6db80e9a3bd # v28.1.0
      with:
        version: 28.1.0
    - uses: taiki-e/install-action@cde8c9e634f4a17bc06b61413ac0ef75450eac46
      with:
        tool: just
    - run: just build
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: |
          ~/.cargo/bin/cargo-kani
          ~/.cargo/bin/kani-driver
          ~/.kani
        key: kani-${{ env.KANI_VERSION }}-${{ runner.os }}
    # The cache restores cargo-kani without cargo's install record, so a plain
    # cargo install refuses to overwrite it ("binary already exists"). Skip when
    # the cached binary is already the right version; force it when it is not.
    - run: |
        if ! cargo-kani --version 2>/dev/null | grep -qF "$KANI_VERSION"; then
          cargo install --locked kani-verifier --version "$KANI_VERSION" --force
        fi
    - run: test -d "$HOME/.kani/kani-$KANI_VERSION" || cargo-kani setup
    # sccache, which stellar/actions/rust-cache installs as RUSTC_WRAPPER, probes
    # the compiler with -E and kani-compiler rejects it, so it cannot wrap Kani.
    # Cleared here rather than job-wide so just build and the install keep it.
    - run: echo "RUSTC_WRAPPER=" >> "$GITHUB_ENV"
    - name: Verify ${{ matrix.harness }}
      env:
        HARNESS: ${{ matrix.harness }}
        BUDGET: ${{ github.event.inputs.harness_timeout || '10800s' }}
      run: |
        set -uo pipefail
        log="$RUNNER_TEMP/kani.log"
        cargo kani -p pool --lib --exact --harness "$HARNESS" \
          --solver kissat -Z unstable-options --harness-timeout "$BUDGET" \
          2>&1 | tee "$log"
        result=("${PIPESTATUS[@]}")
        if [ "${result[1]}" -ne 0 ]; then exit 1; fi
        python3 scripts/check_kani_ci.py \
          --selection verification/kani-full-harnesses.txt --harness "$HARNESS" \
          --log "$log" --exit-code "${result[0]}"
    - name: Retain proof log
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: kani-full-${{ strategy.job-index }}-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/kani.log
        if-no-files-found: warn
        retention-days: 14

  fuzz:
    if: github.event_name != 'workflow_dispatch' || inputs.scope != 'local'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        persist-credentials: false
    - uses: stellar/actions/rust-cache@97ffa3486f8d355535d989edfe78795f05ec11b6 # main as of 2026-10-23
    - run: rustup toolchain install
    - uses: stellar/stellar-cli@c0f4d0da891bbf214c08b8c5035ae6db80e9a3bd # v28.1.0
      with:
        version: 28.1.0
    - uses: taiki-e/install-action@cde8c9e634f4a17bc06b61413ac0ef75450eac46
      with:
        tool: just
    - run: just build
    - run: rustup toolchain install --profile minimal "$(sed -n 's/^channel = "\(.*\)"/\1/p' test-suites/fuzz/rust-toolchain.toml)"
    - run: cargo install --locked cargo-fuzz --version 0.13.2
    - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: test-suites/fuzz/corpus/fuzz_pool_general
        key: fuzz-corpus-${{ runner.os }}-${{ hashFiles('test-suites/fuzz/rust-toolchain.toml') }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          fuzz-corpus-${{ runner.os }}-${{ hashFiles('test-suites/fuzz/rust-toolchain.toml') }}-
    - run: cargo fuzz run fuzz_pool_general -- -max_total_time=3600 -print_final_stats=1
      working-directory: test-suites/fuzz
    - name: Retain successful corpus growth
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: test-suites/fuzz/corpus/fuzz_pool_general
        key: fuzz-corpus-${{ runner.os }}-${{ hashFiles('test-suites/fuzz/rust-toolchain.toml') }}-${{ github.run_id }}-${{ github.run_attempt }}
    # Failure artifacts retain the reproducer independently of the success cache.
    - if: failure()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: fuzz-crash-${{ github.run_id }}
        path: |
          test-suites/fuzz/artifacts/
          test-suites/fuzz/corpus/
        if-no-files-found: warn
        retention-days: 30

  complete:
    if: always()
    needs: [harnesses, kani, fuzz, local-verification]
    runs-on: ubuntu-latest
    steps:
    - name: Require the selected verification scope
      env:
        SCOPE: ${{ inputs.scope || 'full' }}
        LOCAL: ${{ needs.local-verification.result }}
        HARNESSES: ${{ needs.harnesses.result }}
        KANI: ${{ needs.kani.result }}
        FUZZ: ${{ needs.fuzz.result }}
      run: |
        if [ "$SCOPE" = local ]; then
          test "$LOCAL" = success
        else
          test "$HARNESSES" = success && test "$KANI" = success && test "$FUZZ" = success
        fi

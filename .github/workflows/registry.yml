name: registry
# The in-git deployment registry (registry/) is read by the frontend straight
# from this repo and written by curators via PRs and by the precept-internal
# deploy tooling via registry/registry.py. Every PR runs the offline suite
# (unit tests + schema/canonical-order `check`); PRs that touch registry/**
# additionally verify it against live chain state, as does any push to main
# that changes it.
#
# registry verify talks to the Soroban JSON-RPC getLedgerEntries with the
# Python standard library (no CLI dependency, same ledger entries the CLI
# reads). The pinned CLI action below keeps `stellar contract info` available
# as an independent cross-check for the job and for operators reproducing a
# failure, installed the same SHA-pinned way as release.yml.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - registry/**
      - .github/workflows/registry.yml

permissions:
  contents: read

jobs:
  check:
    runs-on:
      - ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Unit tests
        run: python3 -m unittest discover -s registry -v
      - name: Registry check
        run: python3 registry/registry.py check

  verify:
    needs: check
    runs-on:
      - ubuntu-latest
    env:
      # Optional repository variable overriding registry.py's public mainnet
      # RPC default.
      MAINNET_RPC: ${{ vars.MAINNET_RPC }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          # Full history so the base SHA below exists locally for git diff.
          fetch-depth: 0
          persist-credentials: false
      - uses: stellar/stellar-cli@c0f4d0da891bbf214c08b8c5035ae6db80e9a3bd # v28.1.0
        with:
          version: 28.1.0
      - name: On-chain verify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = pull_request ]; then
            # Fail closed: any git failure errors the job (set -e + command
            # substitution), and a detection that cannot see the diff verifies
            # rather than silently skipping. A missing base SHA is an error too.
            test -n "$BASE_SHA"
            changed=$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA")
            if ! grep -q '^registry/' <<<"$changed"; then
              echo "registry files unchanged; on-chain verify not required"
              exit 0
            fi
          fi
          python3 registry/registry.py verify --network testnet
          if [ -s registry/mainnet.jsonl ]; then
            python3 registry/registry.py verify --network mainnet ${MAINNET_RPC:+--rpc "$MAINNET_RPC"}
          else
            echo "mainnet.jsonl is empty; nothing to verify"
          fi

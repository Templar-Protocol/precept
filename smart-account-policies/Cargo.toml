# Smart-account policy contracts for the deployed OpenZeppelin admin smart
# account (stellar-contracts v0.8.0, soroban-sdk 28). A standalone workspace on
# purpose: the root workspace pins soroban-sdk =25.3.0, and a policy has to be
# built and tested against the same sdk and `stellar-accounts` types as the
# account that calls it. Same precedent as tools/abtest and test-suites/fuzz.
[workspace]
resolver = "2"
members = ["pool-pause-policy"]

[workspace.package]
rust-version = "1.98"

[workspace.dependencies]
soroban-sdk = "28.0.0"
stellar-accounts = "0.8.0"

# Same release profile as the root workspace.
[profile.release]
opt-level = "z"
overflow-checks = true # DEV: Do not remove this check - doing so will create vulnerabilities
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[package]
name = "pool-factory"
version = "2.0.0"
authors = ["Blend Capital <gm@blend.capital>"]
license = "Apache-2.0"
edition = "2021"
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
testutils = ["soroban-sdk/testutils"]
# Present so `--features certora` resolves workspace-wide; this crate has no rules.
certora = []

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
rand = {version = "0.7.3"}
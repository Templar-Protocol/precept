[package]
name = "pool"
version = "2.0.0"
authors = ["Blend Capital <gm@blend.capital>"]
license = "MIT"
edition = "2021"
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[features]
testutils = [
    "soroban-sdk/testutils",
]
# Proof-only contract-consumption pilot; never enables a runtime dependency.
local-contracts = []
# Certora Sunbeam rules. Off by default: the cvlr crates are optional, so a
# production build resolves the same dependency graph as upstream Blend.
certora = [
    "dep:cvlr",
    "dep:cvlr-soroban",
    "dep:cvlr-soroban-macros",
    "dep:cvlr-soroban-derive",
]

[dependencies]
soroban-sdk = { workspace = true }
soroban-fixed-point-math = { workspace = true }
cast = { workspace = true }
sep-40-oracle = { workspace = true }
sep-41-token = { workspace = true}
moderc3156 = { workspace = true}

cvlr = { workspace = true, optional = true }
cvlr-soroban = { workspace = true, optional = true }
cvlr-soroban-macros = { workspace = true, optional = true }
cvlr-soroban-derive = { workspace = true, optional = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
backstop = { path = "../backstop", features = ["testutils"] }
sep-40-oracle = { workspace = true, features = ["testutils"] }
sep-41-token = { workspace = true, features = ["testutils"] }
blend-contract-sdk = { workspace = true, features = ["testutils"] }
mock-pool-factory = { path = "../mocks/mock-pool-factory", features = ["testutils"] }
moderc3156-example = { path = "../mocks/moderc3156", features = ["testutils"] }



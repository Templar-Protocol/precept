[package]
name = "pool-oracle-adapter"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true
publish = false
license = "MIT"

[lib]
name = "pool_oracle_adapter"
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true, features = ["alloc"] }
templar-proxy-oracle-soroban-common = { git = "https://github.com/Templar-Protocol/contracts", rev = "6477b1d7ef0e17ed4ba6e6fcfa9493d049cca4eb" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["alloc", "testutils"] }
templar-proxy-oracle-soroban-contract = { git = "https://github.com/Templar-Protocol/contracts", rev = "6477b1d7ef0e17ed4ba6e6fcfa9493d049cca4eb", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
wasm-smoke = []
# DANGEROUS: `lastprice` calls the parent's permissionless `refresh` first, so every
# priced pool action pulls its own price and no keeper is needed for freshness.
# Builds a different artifact from the audited one; see README before deploying.
dangerous-eager-refresh = []

[[test]]
name = "optimized_wasm"
required-features = ["wasm-smoke"]

